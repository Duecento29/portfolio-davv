  <script>
  
document.addEventListener('DOMContentLoaded', (event) => {
  const sourceIdNames = ["scritta_2"];
  

  const candidateElement = document.getElementById("scritta_2")
  candidateElement.addEventListener("animationend", (event) => {
    if (event.animationName === "animation_scritta_2_flow_2") {

      sourceIdNames.forEach((id, index) => {
        const element = document.getElementById(id)
      
        const animation = element.style.animation
      
        element.style.animation =  'none'
        setTimeout(() => {
          element.style.animation = animation
        }, 5) 
      })
    };
  });

})
</script>
