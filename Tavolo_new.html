    <script>
    function openProjCarousel() {
        if (window.openCarousel) window.openCarousel();
    }
    // Remove overlay after animation (~4.4s) — only on first visit
    (function(){
        var overlay=document.getElementById('intro-overlay');
        if(overlay){
            if(sessionStorage.getItem('davv_tavolo')){
                overlay.style.display='none';
            } else {
                sessionStorage.setItem('davv_tavolo','1');
                setTimeout(function(){
                    var ov=document.getElementById('intro-overlay');
                    if(ov)ov.style.display='none';
                },4400);
            }
        }
    })();

    </script>
